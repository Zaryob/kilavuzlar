title: Kılavuzlar
author: Süleyman Poyraz
email: zaryob.dev@gmail.com
description: Yazılım geliştirme ve sistem yönetimi üzerine kişisel kılavuzlar.
lang: tr
baseurl: "/kilavuzlar"
url: "https://zaryob.github.io"
github_username: Zaryob
markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

readme_index:
  with_frontmatter: true
relative_links:
  enabled: true
  collections: false

plugins:
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-redirect-from

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - scripts

# Common Zaryob navigation; override suite_url for a combined local preview.
suite_url: "https://zaryob.github.io"
suite_section: kilavuzlar
